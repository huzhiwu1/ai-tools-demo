<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSE 流式接口测试 · hello-nest-langchain</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #1f2937;
      }
      h1 { margin-bottom: 0.25rem; }
      .subtitle { color: #6b7280; margin-top: 0; margin-bottom: 1.5rem; }
      label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
      input[type="text"] {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
        margin-bottom: 1rem;
      }
      .row { display: flex; gap: 0.75rem; }
      button {
        padding: 0.6rem 1.2rem;
        font-size: 1rem;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button.primary { background: #2563eb; color: white; }
      button.primary:hover { background: #1d4ed8; }
      button.secondary { background: #e5e7eb; color: #1f2937; }
      button.secondary:hover { background: #d1d5db; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .output {
        margin-top: 1.5rem;
        padding: 1rem;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #f9fafb;
        min-height: 160px;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.7;
      }
      .output:empty::before {
        content: "回复将显示在这里...";
        color: #9ca3af;
      }
      .status {
        margin-top: 0.5rem;
        font-size: 0.875rem;
        color: #6b7280;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <h1>🚀 SSE 流式接口测试</h1>
    <p class="subtitle">第四站 · 体验 LangChain LCEL 流式输出 + Nest @Sse</p>

    <label for="apiUrl">API 地址</label>
    <input type="text" id="apiUrl" value="http://localhost:3000" />

    <label for="query">问题</label>
    <input type="text" id="query" value="什么是 LangChain？用 100 字内介绍" />

    <div class="row">
      <button type="button" id="btn" class="primary">▶️ 开始流式请求</button>
      <button type="button" id="stopBtn" class="secondary">⏹️ 停止</button>
    </div>
    <p class="status" id="status"></p>
    <div class="output" id="output"></div>

    <script>
      // -----------------------------
      // 前端如何消费 SSE：用浏览器原生 EventSource
      // -----------------------------
      const apiUrlInput = document.getElementById("apiUrl");
      const queryInput = document.getElementById("query");
      const btn = document.getElementById("btn");
      const stopBtn = document.getElementById("stopBtn");
      const output = document.getElementById("output");
      const status = document.getElementById("status");

      let eventSource = null;

      btn.addEventListener("click", () => {
        const baseUrl = apiUrlInput.value.replace(/\/$/, "");
        const q = queryInput.value.trim();
        if (!q) {
          status.textContent = "请输入问题";
          return;
        }

        const url = `${baseUrl}/ai/chat/stream?query=${encodeURIComponent(q)}`;
        output.textContent = "";
        btn.disabled = true;
        status.textContent = "🔌 连接中...";

        // 关键：new EventSource(url) 会自动发起 GET 请求并保持连接
        eventSource = new EventSource(url);

        // 收到 data: 行时触发；data 是 Nest 端 { data: '...' } 中的字符串
        eventSource.onmessage = ({ data }) => {
          // Nest @Sse 默认会把 { data: '...' } 中的 data 字段 JSON.stringify 后发出
          // 浏览器收到的就是带引号的 JSON 字符串，需要 JSON.parse 还原
          let chunk = data;
          try { chunk = JSON.parse(data); } catch (e) {}
          output.textContent += chunk;
          status.textContent = "📩 接收中...";
        };

        eventSource.onerror = () => {
          eventSource && eventSource.close();
          eventSource = null;
          btn.disabled = false;
          status.textContent = "✅ 连接已结束";
        };
      });

      stopBtn.addEventListener("click", () => {
        if (eventSource) {
          eventSource.close();
          eventSource = null;
          btn.disabled = false;
          status.textContent = "⏹️ 已手动停止";
        }
      });
    </script>
  </body>
</html>
